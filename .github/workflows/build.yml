name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q BoothDediche.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: BoothDediche
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: camera-apk
          path: BoothDediche/camera/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-apk
          path: BoothDediche/tablet/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: control-apk
          path: BoothDediche/control/build/outputs/apk/debug/*.apk
