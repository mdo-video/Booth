name: Estrai zip
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  estrai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trova lo zip giusto
        run: |
          ls -la *.zip
          OK=""
          for z in *.zip; do
            rm -rf tmp
            if unzip -q "$z" -d tmp 2>/dev/null && grep -q '^appVersionName=1.14' tmp/BoothDediche/gradle.properties 2>/dev/null; then
              OK="$z"; break
            fi
          done
          [ -n "$OK" ] || { echo "Nessuno zip valido con la 1.14"; exit 1; }
          echo "Uso: $OK"
          rm -rf tmp/BoothDediche/.github
          cp -a tmp/BoothDediche/. .
          rm -rf tmp

      - name: Salva i file nel repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Estrai zip 1.14" || echo "Niente da salvare"
          git push

      - name: Avvia la compilazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-apk.yml --ref main
