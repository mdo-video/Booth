name: Estrai zip
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  estrai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trova lo zip piu recente
        run: |
          ls -la *.zip
          BEST=0
          OK=""
          for z in *.zip; do
            rm -rf t
            mkdir t
            if unzip -q "$z" -d t 2>/dev/null && [ -f t/BoothDediche/gradle.properties ]; then
              c=$(grep '^appVersionCode=' t/BoothDediche/gradle.properties | cut -d= -f2)
              echo "$z -> versione $c"
              if [ "$c" -gt "$BEST" ]; then BEST=$c; OK="$z"; fi
            fi
          done
          rm -rf t
          [ -n "$OK" ] || { echo "Nessuno zip valido"; exit 1; }
          echo "Uso: $OK (versione $BEST)"
          mkdir t
          unzip -q "$OK" -d t
          rm -rf t/BoothDediche/.github
          cp -a t/BoothDediche/. .
          rm -rf t

      - name: Salva i file nel repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Estrai zip" || echo "Niente da salvare"
          git push

      - name: Avvia la compilazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-apk.yml --ref main
